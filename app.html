<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tenet People — Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css">
<style>
  body { font-size: 14px; }
  .shell { display: grid; grid-template-columns: 252px 1fr; min-height: 100vh; }
  aside.side { background: var(--ink); color: #c9d1dd; padding: 18px 14px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  aside .logo { color: #fff; padding: 4px 8px 18px; }
  aside .logo-mark { background: #fff; color: var(--ink); }
  aside .logo small { color: #8b97a8; }
  .side-label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #6f7c90; padding: 14px 10px 6px; font-weight: 700; }
  .nav-item { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 9px; color: inherit; text-decoration: none; font-weight: 500; }
  .nav-item:hover { background: rgba(255,255,255,.06); color: #fff; }
  .nav-item.on { background: rgba(255,255,255,.1); color: #fff; box-shadow: inset 3px 0 0 var(--brand-2); }
  .nav-item .badge { margin-left: auto; background: var(--red); color: #fff; font-size: 11px; border-radius: 999px; padding: 0 7px; font-weight: 700; }
  .side-foot { margin-top: auto; padding: 14px 10px 4px; border-top: 1px solid rgba(255,255,255,.08); font-size: 12px; color: #8b97a8; }
  .side-foot b { color: #fff; display: block; font-size: 13px; }

  .main { min-width: 0; }
  .top { display: flex; align-items: center; gap: 14px; padding: 14px 28px; border-bottom: 1px solid var(--line); background: rgba(246,245,241,.9); backdrop-filter: blur(10px); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; }
  .top .menu-btn { display: none; background: none; border: 0; padding: 6px; cursor: pointer; }
  .search { flex: 1; max-width: 420px; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; color: var(--muted); }
  .search input { border: 0; outline: 0; background: none; flex: 1; min-width: 0; }
  .top-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; position: relative; }
  .icon-btn .dot { position: absolute; top: 7px; right: 8px; width: 7px; height: 7px; background: var(--red); border-radius: 50%; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--gold-soft); color: #8a611c; display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; }

  .view { padding: 28px; max-width: 1280px; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
  .page-head h1 { font-family: var(--serif); font-weight: 500; font-size: 30px; margin-top: 6px; }
  .page-head p { margin: 6px 0 0; color: var(--ink-2); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .grid { display: grid; gap: 16px; }
  .g4 { grid-template-columns: repeat(4, 1fr); }
  .g3 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .g2 { grid-template-columns: 1fr 1fr; }
  .g21 { grid-template-columns: 2fr 1fr; }
  .g12 { grid-template-columns: 1fr 2fr; }
  .mt { margin-top: 16px; }

  .tile { padding: 18px; }
  .tile small { color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .tile strong { display: block; font-family: var(--serif); font-weight: 500; font-size: 30px; margin: 6px 0 2px; }
  .tile .delta { font-size: 12px; font-weight: 600; }
  .up { color: var(--brand); } .down { color: var(--red); }

  .panel { padding: 20px; }
  .panel-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .panel-h h3 { font-size: 15px; font-weight: 600; }
  .panel-h span.sub { color: var(--muted); font-size: 12px; }

  table.t { width: 100%; border-collapse: collapse; }
  .t th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .t td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .t tr:last-child td { border-bottom: 0; }
  .t tbody tr:hover td { background: #fafaf7; }
  .t .num { text-align: right; font-variant-numeric: tabular-nums; }
  .table-wrap { overflow-x: auto; margin: 0 -8px; }
  .person { display: flex; align-items: center; gap: 10px; }
  .person .avatar { width: 30px; height: 30px; font-size: 11px; background: var(--surface-2); color: var(--ink-2); }
  .person b { display: block; font-weight: 600; }
  .person span { color: var(--muted); font-size: 12px; }

  .tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 999px; width: max-content; max-width: 100%; overflow-x: auto; margin-bottom: 16px; }
  .tabs button { border: 0; background: none; padding: 7px 16px; border-radius: 999px; font-weight: 600; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
  .tabs button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

  .bar { height: 7px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--brand-2); border-radius: 99px; transition: width .5s ease; }
  .list-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
  .list-row:first-child { border-top: 0; }
  .list-row .grow { flex: 1; min-width: 0; }
  .list-row .grow b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-row .grow span { color: var(--muted); font-size: 12px; }
  .ic-sq { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; }

  .kanban { display: grid; grid-template-columns: repeat(6, minmax(170px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
  .col { background: var(--surface-2); border-radius: 12px; padding: 10px; min-height: 180px; }
  .col h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 2px 4px 10px; display: flex; justify-content: space-between; }
  .kcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 8px; }
  .kcard b { display: block; font-size: 13px; }
  .kcard span { font-size: 12px; color: var(--muted); }
  .kcard .row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .kcard button { border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 2px 8px; font-size: 12px; cursor: pointer; font-weight: 600; }
  .kcard button:hover { background: var(--brand-soft); color: var(--brand); border-color: transparent; }

  .steps { display: flex; gap: 0; margin: 4px 0 18px; }
  .step { flex: 1; text-align: center; position: relative; font-size: 12px; color: var(--muted); font-weight: 600; }
  .step::before { content: ""; position: absolute; top: 13px; left: -50%; right: 50%; height: 2px; background: var(--line); z-index: 0; }
  .step:first-child::before { display: none; }
  .step i { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 6px; background: var(--surface-2); position: relative; z-index: 1; font-style: normal; }
  .step.done i { background: var(--brand); color: #fff; } .step.done::before, .step.cur::before { background: var(--brand); }
  .step.cur i { background: var(--ink); color: #fff; } .step.done, .step.cur { color: var(--ink); }

  .ring { position: relative; width: 132px; height: 132px; flex: none; }
  .ring svg { transform: rotate(-90deg); }
  .ring div { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .ring strong { font-family: var(--serif); font-size: 32px; font-weight: 500; display: block; line-height: 1; }
  .ring span { font-size: 11px; color: var(--muted); }

  .pillar-card { padding: 16px; display: flex; gap: 12px; align-items: flex-start; text-decoration: none; transition: transform .15s; }
  .pillar-card:hover { transform: translateY(-2px); }
  .pillar-card b { display: block; }
  .pillar-card span { color: var(--muted); font-size: 12px; }

  .modal-bg { position: fixed; inset: 0; background: rgba(15,27,45,.45); display: none; place-items: center; z-index: 50; padding: 16px; }
  .modal-bg.open { display: grid; }
  .modal { width: 100%; max-width: 520px; padding: 24px; max-height: calc(100vh - 32px); overflow-y: auto; }
  .modal h3 { font-family: var(--serif); font-weight: 500; font-size: 22px; margin-bottom: 16px; }
  .field { display: grid; gap: 5px; margin-bottom: 12px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .field input, .field select { padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); }
  .field input:focus, .field select:focus { outline: 2px solid var(--brand-2); outline-offset: -1px; }
  .modal .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }

  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 999px; font-weight: 500; opacity: 0; transition: .25s; z-index: 60; display: flex; gap: 8px; align-items: center; pointer-events: none; max-width: calc(100% - 32px); }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  .toast .icon { color: #7fd1b3; }

  .empty { color: var(--muted); padding: 18px 0; text-align: center; }
  .toggle { width: 38px; height: 22px; border-radius: 99px; background: var(--line); border: 0; position: relative; cursor: pointer; flex: none; transition: background .2s; }
  .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .2s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .toggle.on { background: var(--brand-2); } .toggle.on::after { left: 19px; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .note { background: var(--gold-soft); color: #6f4e15; border-radius: 10px; padding: 10px 14px; font-size: 13px; display: flex; gap: 8px; align-items: center; }

  .demo-tag { display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--ink-2); min-width: 0; }
  .explain { padding: 0; margin-bottom: 20px; overflow: hidden; border-color: #cfe5da; }
  .explain-grid { display: grid; grid-template-columns: repeat(3, 1fr); }
  .explain-grid > div { padding: 16px 18px; border-left: 1px solid #d8ebe1; font-size: 13.5px; color: var(--ink-2); }
  .explain-grid > div:first-child { border-left: 0; }
  .explain-grid b { display: flex; gap: 7px; align-items: center; color: var(--ink); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
  .explain-grid b .icon { width: 15px; height: 15px; }
  .explain-foot { background: var(--brand-soft); padding: 10px 18px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12px; }
  .explain-foot .chip { background: #fff; }
  .explain-foot a { margin-left: auto; font-weight: 600; color: var(--brand); text-decoration: none; }
  .svc-card { padding: 18px; display: flex; flex-direction: column; gap: 10px; text-decoration: none; transition: transform .15s; }
  .svc-card:hover { transform: translateY(-2px); }
  .svc-card h4 { font-size: 15px; display: flex; gap: 10px; align-items: center; }
  .svc-card ul { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 13px; display: grid; gap: 4px; }
  .svc-card .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
  .guide-step { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink-2); }
  .guide-step:first-of-type { border-top: 0; }
  .guide-step .n { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
  @media (max-width: 1100px) { .g4 { grid-template-columns: 1fr 1fr; } .g21, .g12 { grid-template-columns: 1fr; } }
  @media (max-width: 860px) {
    .shell { grid-template-columns: 1fr; }
    aside.side { position: fixed; left: 0; top: 0; z-index: 40; width: 260px; transform: translateX(-100%); transition: transform .25s; }
    aside.side.open { transform: none; box-shadow: 0 0 0 100vmax rgba(15,27,45,.4); }
    .top .menu-btn { display: block; }
    .top { padding: 12px 16px; }
    .view { padding: 20px 16px; }
    .g2 { grid-template-columns: 1fr; }
    .explain-grid { grid-template-columns: 1fr; }
    .explain-grid > div { border-left: 0; border-top: 1px solid #d8ebe1; }
    .explain-grid > div:first-child { border-top: 0; }
    .demo-tag span:last-child { display: none; }
    .hide-sm { display: none; }
  }
  @media (max-width: 520px) { .g4 { grid-template-columns: 1fr 1fr; } .tile strong { font-size: 24px; } }
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side">
    <a class="logo" href="index.html"><span class="logo-mark">T</span> Tenet <small>People</small></a>
    <nav id="nav"></nav>
    <div class="side-foot"><b id="orgName"></b><span id="orgPlan"></span><br><a href="#" id="resetDemo" style="color:#7fd1b3">Reset demo data</a></div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="menu-btn" id="menuBtn" aria-label="Open menu"></button>
      <div class="demo-tag"><span class="chip gold">Demo</span><span>You are viewing the client portal of a <b>sample client</b>, Meridian Components (612 employees, 4 sites)</span></div>
      <div class="top-right">
        <button class="btn btn-ghost btn-sm" id="guideBtn">How this demo works</button>
        <a class="btn btn-ghost btn-sm hide-sm" href="index.html">← Back to services</a>
      </div>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>

<div class="modal-bg" id="modalBg"><div class="card modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>

<script src="assets/icons.js"></script>
<script src="assets/services.js"></script>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
